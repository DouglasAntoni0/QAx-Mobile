name: Yodapp CI Raiz 🤖

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  testar-no-emulador:
    runs-on: ubuntu-latest
    env:
      APPIUM_HOME: ${{ github.workspace }}/.appium

    steps:
      - name: 🛎️ Clonar o código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ⚡ Habilitar aceleração KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 📦 Instalar dependências do Yodapp
        working-directory: ./projects-javascript/yodapp-robot
        run: npm ci

      - name: ⚙️ Configurar o driver Android do Appium
        working-directory: ./projects-javascript/yodapp-robot
        run: |
          mkdir -p "$APPIUM_HOME"
          npx appium driver install uiautomator2@8.1.0

      - name: 📱 Subir Emulador e Rodar Testes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: ./projects-javascript/yodapp-robot
          script: |
            if npm run test; then
              exit 0
            fi

            mkdir -p ci-artifacts
            adb -s emulator-5554 exec-out screencap -p > ci-artifacts/failure.png || true
            adb -s emulator-5554 shell uiautomator dump /sdcard/window.xml || true
            adb -s emulator-5554 pull /sdcard/window.xml ci-artifacts/window.xml || true
            adb -s emulator-5554 logcat -d > ci-artifacts/logcat.txt || true
            exit 1

      - name: 📎 Publicar diagnósticos Android
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: yodapp-android-diagnostics
          path: projects-javascript/yodapp-robot/ci-artifacts
          if-no-files-found: ignore
